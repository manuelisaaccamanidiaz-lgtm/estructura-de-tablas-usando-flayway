# ===================== PERFIL: DESARROLLO =====================
spring:
  # ---------- Conexión a PostgreSQL ----------
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mindconnect_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # ---------- JPA / Hibernate ----------
  jpa:
    hibernate:
      ddl-auto: none            # Flyway crea las tablas, Hibernate NO
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        "[physical_naming_strategy]": org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        "[default_schema]": mindconnect
        "[format_sql]": true

  # ---------- Flyway ----------
  flyway:
    enabled: true
    locations: classpath:db/migration
    create-schemas: true        # crea el esquema si no existe
    schemas:
      - mindconnect
    default-schema: mindconnect
    table: flyway_schema_history
    baseline-on-migrate: true
    baseline-version: 0

# ---------- CORS (para el frontend) ----------
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000} 